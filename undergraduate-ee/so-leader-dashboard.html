<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undergraduate EE SO Leader Dashboard</title><link rel="stylesheet" href="../assets/portal.css"><script defer src="../assets/portal.js"></script><style>.so-reference{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.so-reference-code{font-weight:800;font-size:18px;color:var(--cyan)}.so-reference p{margin:5px 0 11px;line-height:1.45}.so-reference-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.so-reference ul{list-style:none;margin:7px 0 0;padding:0;display:grid;gap:5px}.so-reference li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;line-height:1.4}@media(max-width:600px){.so-reference{padding:12px}.so-reference li{grid-template-columns:46px minmax(0,1fr)}}</style></head><body><div id="header-placeholder"></div><div class="wrap" style="padding-top: 14px;"><div class="title" style="margin-bottom: 24px;"><h1>Undergraduate EE SO Leader Dashboard</h1><p>PSU College of Engineering Curriculum Intelligence Portal</p></div>
<section class="hero"><span class="kicker">ABET evidence</span><h2>SO Leader Dashboard</h2><p class="muted">Select a student outcome to inspect PI coverage and mapped CLO evidence.</p></section><section class="card"><div class="toolbar"><select id="soSelect" class="select"></select><input id="search" class="input" placeholder="Search within selected SO…"></div><div id="soInfo" class="muted"></div></section><section id="stats" class="grid four" style="margin-top:14px"></section><section class="card" style="margin-top:14px"><h2>Mapped CLO Evidence</h2><div id="evidence"></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{try{const cur=await portal.loadJSON('../data/ee_curriculum_with_sos_pis.json'); const map=await portal.loadJSON('../data/ee_program_clo_so_pi_mapping.json'); const courses=cur.curriculum.courses||[]; const outcomes=map.student_outcomes||[]; const sel=byId('soSelect'); sel.innerHTML=outcomes.map(o=>`<option value="${portal.esc(o.so_code)}">${portal.esc(o.so_code)}</option>`).join(''); const search=byId('search'); const info=byId('soInfo'); function renderSOReference(){const outcome=outcomes.find(item=>item.so_code===sel.value)||outcomes[0];if(!outcome){info.innerHTML='';return}const pis=outcome.pis||[];const statement=outcome.so_statement||pis.find(pi=>pi.so_statement)?.so_statement||'';info.innerHTML=`<div class="so-reference"><div class="so-reference-code">${portal.esc(outcome.so_code)}</div><p>${portal.esc(statement)}</p><div class="so-reference-label">Performance Indicators</div><ul>${pis.map(pi=>`<li><span class="code">${portal.esc(pi.pi_code)}</span><span>${portal.esc(pi.pi_statement||'')}</span></li>`).join('')}</ul></div>`} function render(){const so=sel.value||outcomes[0]?.so_code; const q=(search.value||'').toLowerCase(); const o=outcomes.find(x=>x.so_code===so); const expected=(o?.pis||[]).map(p=>p.pi_code); const rows=[]; courses.forEach(course=>(course.clos||[]).forEach(clo=>{if((clo.mapped_sos||[]).includes(so)){const txt=[course.course_code,course.course_title,clo.clo_text,(clo.pi_codes||[]).join(' ')].join(' ').toLowerCase(); if(!q||txt.includes(q)) rows.push({course,clo});}})); const covered=new Set(rows.flatMap(r=>r.clo.pi_codes||[]).filter(p=>expected.includes(p))); renderSOReference(); portal.renderStats(byId('stats'),{'Mapped courses':new Set(rows.map(r=>r.course.course_code)).size,'Mapped CLOs':rows.length,'Expected PIs':expected.length,'Covered PIs':covered.size}); byId('evidence').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Course</th><th>CLO</th><th>PI</th><th>Assessment</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="course-dashboard.html?course=${encodeURIComponent(r.course.course_code)}"><span class="code">${portal.esc(r.course.course_code)}</span><br>${portal.esc(r.course.course_title)}</a></td><td>${portal.esc(r.clo.clo_text)}</td><td>${(r.clo.pi_codes||[]).map(portal.badge).join('')}</td><td>${portal.esc(portal.listText(r.clo.assessment_methods))}</td></tr>`).join('')}</tbody></table></div>`} sel.onchange=render; search.oninput=render; render();}catch(e){byId('evidence').innerHTML='<div class="alert">Could not load outcome information.</div>'}})</script>
<div class="footer">Undergraduate Electrical Engineering Curriculum Intelligence Portal</div></div>
<div id="footer-placeholder"></div>

</body></html>
