<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undergraduate EE Course Dashboard</title><link rel="stylesheet" href="../assets/portal.css"><script defer src="../assets/portal.js"></script></head><body><div id="header-placeholder"></div><div class="wrap" style="padding-top: 14px;"><div class="title" style="margin-bottom: 24px;"><h1>Undergraduate EE Course Dashboard</h1><p>PSU College of Engineering Curriculum Intelligence Portal</p></div>
<section class="hero"><span class="kicker">Undergraduate EE</span><h2>Course-level CLO–SO–PI Dashboard</h2><p class="muted">Per-course mapping generated from the JSON file.</p></section><div class="layout"><aside class="card sidebar"><h2>Courses</h2><div class="toolbar"><input id="search" class="input" placeholder="Search…"><select id="trackFilter" class="select"></select><span id="resultCount" class="pill"></span></div><div id="courseList" class="course-list"></div></aside><main id="detail" class="grid"></main></div><script>document.addEventListener('DOMContentLoaded',async()=>{try{const data=await portal.loadJSON('../data/ee_curriculum_with_sos_pis.json'); const courses=data.curriculum.courses||[]; portal.setupCourseBrowser(courses,{linkPrefix:'course-dashboard.html?course='}); const wanted=portal.getParam('course')||portal.normCourse(courses[0]).code; const raw=courses.find(x=>portal.normCourse(x).code===wanted)||courses[0]; const c=portal.normCourse(raw); byId('detail').innerHTML=`<section class="card"><div class="code">${portal.esc(c.code)}</div><h2>${portal.esc(c.title)}</h2><div>${portal.badge(c.track)}${portal.badge(c.re)}${portal.badge('Level '+c.level)}${portal.badge(c.credits+' credits')}</div></section><section class="card"><h2>CLO–SO–PI Mapping</h2><div class="table-wrap"><table><thead><tr><th>CLO</th><th>Text</th><th>SO</th><th>PI</th><th>Teaching Strategy</th><th>Assessment</th></tr></thead><tbody>${(raw.clos||[]).map(x=>`<tr><td class="code">${portal.esc(x.clo_number)}</td><td>${portal.esc(x.clo_text)}</td><td>${(x.mapped_sos||[]).map(s=>portal.badge(s)).join('')}</td><td>${(x.pi_codes||[]).map(s=>portal.badge(s)).join('')}</td><td>${portal.esc(x.teaching_strategy)}</td><td>${portal.esc(x.assessment_methods)}</td></tr>`).join('')}</tbody></table></div></section>`;}catch(e){byId('detail').innerHTML='<div class="alert">Could not load JSON.</div>'}})</script>
<div class="footer">One source of truth: JSON data files. Refresh the page after updating JSON.</div></div>
<div id="footer-placeholder"></div>

</body></html>
