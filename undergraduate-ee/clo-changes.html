<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undergraduate EE CLO Change Report</title>
  <link rel="stylesheet" href="../assets/portal.css">
  <script defer src="../assets/portal.js"></script>
  <style>
    .report-controls { display:grid; grid-template-columns:minmax(260px,1fr) auto; gap:14px; align-items:end; }
    .report-controls label { display:block; color:var(--muted); font-size:13px; font-weight:700; margin-bottom:7px; }
    .report-select { width:100%; min-height:46px; padding:10px 13px; color:var(--text); background:#111d2e; border:1px solid var(--line); border-radius:12px; font:600 14px var(--sans); }
    .summary-line { color:var(--muted); font-size:13px; text-align:right; padding-bottom:12px; }
    .change-list { display:grid; gap:16px; margin-top:16px; }
    .change-card { border:1px solid var(--line); border-radius:20px; background:var(--panel); overflow:hidden; box-shadow:var(--shadow); }
    .change-head { display:flex; justify-content:space-between; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line); }
    .change-id { font:800 15px var(--mono); color:var(--cyan); }
    .status { display:inline-flex; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    .status.modified { color:#ffe2ad; background:rgba(242,162,58,.16); border:1px solid rgba(242,162,58,.4); }
    .status.added { color:var(--green); background:rgba(126,231,135,.12); border:1px solid rgba(126,231,135,.35); }
    .status.omitted { color:var(--red); background:rgba(255,123,114,.12); border:1px solid rgba(255,123,114,.35); }
    .compare-grid { display:grid; grid-template-columns:1fr 1fr; }
    .version { min-width:0; padding:18px; }
    .version + .version { border-left:1px solid var(--line); }
    .version h3 { margin:0 0 12px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
    .old h3 { color:var(--red); } .new h3 { color:var(--green); }
    .clo-text { white-space:pre-wrap; line-height:1.65; color:var(--text); min-height:52px; }
    .mapping { margin-top:15px; padding-top:12px; border-top:1px solid var(--line); }
    .mapping-label { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; margin-right:7px; }
    .empty { color:var(--muted); font-style:italic; }
    .no-change { padding:28px; text-align:center; border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.08); border-radius:20px; }
    .no-change strong { display:block; color:var(--green); font-size:20px; margin-bottom:7px; }
    @media (max-width:760px) {
      .report-controls { grid-template-columns:1fr; }
      .summary-line { text-align:left; padding:0; }
      .compare-grid { grid-template-columns:1fr; }
      .version + .version { border-left:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="wrap">
    <section class="hero">
      <span class="kicker">Undergraduate EE · Change history</span>
      <h2>CLO Old vs New</h2>
      <p class="muted">Select a course to review CLO wording and SO–PI mapping changes from the previous JSON version to the latest workbook-aligned version.</p>
    </section>
    <section class="card">
      <div class="report-controls">
        <div>
          <label for="courseSelect">Course</label>
          <select id="courseSelect" class="report-select" aria-label="Select an undergraduate EE course"></select>
        </div>
        <div id="summary" class="summary-line" aria-live="polite"></div>
      </div>
    </section>
    <section id="courseHeading" class="card" style="margin-top:16px"></section>
    <section id="results" class="change-list" aria-live="polite"></section>
  </main>
  <div id="footer-placeholder"></div>
  <script>

ansform concepts and their applications for LTI systems by interpreting frequency-domain results.","aligned_sos":["SO1","SO6"],"aligned_pis":["PI12","PI63"]}},{"id":"2.4","status":"CLO modified","old":{"domain":null,"clo_id":2.4,"clo_text":"Write MatLab code and sampling theory and develop discrete system. \nWrite MATLAB code to implement sampling-based discrete-time systems and evaluate their performance using independently learned tools or functions.","aligned_sos":["SO6","SO7"],"aligned_pis":["PI63","PI64","PI71"]},"new":{"domain":null,"clo_id":2.4,"clo_text":"Write MATLAB code to implement sampling-based discrete-time systems and evaluate their performance using independently learned tools or functions.","aligned_sos":["SO6","SO7"],"aligned_pis":["PI63","PI64","PI71"]}}]},{"code":"EE 202","title":"Circuit Analysis","changes":[]},{"code":"EE 312","title":"Electronic Engineering","changes":[]},{"code":"EE 322","title":"Microprocessors Design","changes":[{"id":"1.1","status":"CLO modified","old":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Describe the types and operation of a typical microprocessors/microcontrollers.\nExplain the functional organization and operation of microprocessor components including datapath, control unit, registers, ALU, and buses.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]},"new":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Describe the types and operation of a typical microprocessors/microcontrollers.","aligned_sos":["SO3"],"aligned_pis":["PI31","PI32"]}},{"id":"1.2","status":"CLO modified","old":{"domain":null,"clo_id":1.2,"clo_text":"Recognize various memory technologies, cache memories, addressing modes, memory mapping, and composing memories.\nModel digital components of microprocessor-based systems using HDL at the RTL level.","aligned_sos":[],"aligned_pis":[]},"new":{"domain":null,"clo_id":1.2,"clo_text":"Recognize various memory technologies, cache memories, addressing modes, memory mapping, and composing memories.","aligned_sos":[],"aligned_pis":[]}},{"id":"2.1","status":"CLO modified","old":{"domain":"Skills","clo_id":2.1,"clo_text":"Explain the operations of peripherals typically used for interfacing microprocessors, such as A/D & D/A converters, Timer, Counters, LCDs, UART, PWM controllers, regular and stepper motors, Real time clocks.\nDesign arithmetic, logic, and timing components such as ALUs, registers, counters, and clock/timing circuits.","aligned_sos":[],"aligned_pis":[]},"new":{"domain":"Skills","clo_id":2.1,"clo_text":"Explain the operations of peripherals typically used for interfacing microprocessors, such as A/D & D/A converters, Timer, Counters, LCDs, UART, PWM controllers, regular and stepper motors, Real time clocks.","aligned_sos":[],"aligned_pis":[]}},{"id":"2.2","status":"CLO modified","old":{"domain":null,"clo_id":2.2,"clo_text":"Illustrate microprocessor communication basics, hardware interfacing techniques, I/O addressing, interrupts, direct memory access, arbitration, and multi-level bus architectures. \nDesign control units and sequential systems using finite state machines for system control applications.","aligned_sos":[],"aligned_pis":[]},"new":{"domain":null,"clo_id":2.2,"clo_text":"Illustrate microprocessor communication basics, hardware interfacing techniques, I/O addressing, interrupts, direct memory access, arbitration, and multi-level bus architectures.","aligned_sos":[],"aligned_pis":[]}},{"id":"3.1","status":"CLO modified","old":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Demonstrate the ability to configure hardware and software microprocessor-based systems\nImplement and verify an integrated digital system combining datapath and control components on FPGA hardware.","aligned_sos":["SO2","SO5","SO6"],"aligned_pis":["PI21","PI22","PI23","PI24","PI52","PI61"]},"new":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Demonstrate the ability to configure hardware and software microprocessor-based systems","aligned_sos":["SO2","SO5","SO6"],"aligned_pis":["PI21","PI22","PI23","PI24","PI52","PI61"]}}]},{"code":"EE 341","title":"Electromagnetics Fundamental","changes":[{"id":"1.1","status":"CLO modified","old":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Explain the concept of electric field and magnetic field.\nExplain the fundamental concepts of electromagnetics, including electric and magnetic fields and their sources in free space and material media.","aligned_sos":["SO1"],"aligned_pis":["PI12"]},"new":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Explain the fundamental concepts of electromagnetics, including electric and magnetic fields and their sources in free space and material media.","aligned_sos":["SO1"],"aligned_pis":["PI12"]}},{"id":"2.1","status":"CLO modified","old":{"domain":"Skills","clo_id":2.1,"clo_text":"Analyze Maxwell’s equations to find the electric and magnetic field components in different media.\nApply Maxwell’s equations to determine electric and magnetic field components in different media and under relevant boundary conditions.","aligned_sos":["SO1"],"aligned_pis":["PI12"]},"new":{"domain":"Skills","clo_id":2.1,"clo_text":"Apply Maxwell’s equations to determine electric and magnetic field components in different media and under relevant boundary conditions.","aligned_sos":["SO1"],"aligned_pis":["PI12"]}},{"id":"2.2","status":"CLO modified","old":{"domain":null,"clo_id":2.2,"clo_text":"Develop an ability to apply Gauss’ law, Ampere’s Law, Biot-Savart law, Faraday’s law and Maxwell’s equations in the analysis of electromagnetic systems.\nAnalyze key electromagnetic parameters, including electric field intensity due to charge distributions, work and electric potential, electric current and current density, and magnetic field intensity.","aligned_sos":["SO1"],"aligned_pis":["PI12"]},"new":{"domain":null,"clo_id":2.2,"clo_text":"Analyze key electromagnetic parameters, including electric field intensity due to charge distributions, work and electric potential, electric current and current density, and magnetic field intensity.","aligned_sos":["SO1"],"aligned_pis":["PI12"]}}]},{"code":"EE 332","title":"Control Systems","changes":[]},{"code":"EE 351","title":"Communication Systems","changes":[{"id":"Portal CLO 10","status":"CLO omitted","old":{"clo_text":"","aligned_sos":["SO2","SO3","SO5","SO6"],"aligned_pis":["PI21","PI22","PI23","PI24","PI31","PI32","PI51","PI52","PI61","PI62","PI63","PI64"]},"new":null}]},{"code":"EE 305","title":"Power Electronics","changes":[]},{"code":"EE 304","title":"Electrical Machines","changes":[]},{"code":"EE 403","title":"Power Systems","changes":[]},{"code":"EE 490","title":"Senior Design Project","changes":[{"id":"1.1","status":"CLO modified","old":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Identify, gather and synthesize relevant information needed to define and solve an open-ended design problem.\nIdentify relevant technical information and engineering principles needed to define and solve an open-ended design problem.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]},"new":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Identify relevant technical information and engineering principles needed to define and solve an open-ended design problem.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]}},{"id":"2.1","status":"CLO modified","old":{"domain":"Skills","clo_id":2.1,"clo_text":"Apply the engineering design process to define, formulate and solve a conceptual design problem considering human factors, safety, environmental, economic, and societal constraints.\nApply the engineering design process to produce solutions that meet specified needs with consideration of safety, environmental, economic, and societal constraints and relevant standards/codes.","aligned_sos":["SO2"],"aligned_pis":["PI21","PI22","PI23","PI24"]},"new":{"domain":"Skills","clo_id":2.1,"clo_text":"Apply the engineering design process to produce solutions that meet specified needs with consideration of safety, environmental, economic, and societal constraints and relevant standards/codes.","aligned_sos":["SO2"],"aligned_pis":["PI21","PI22","PI23","PI24"]}},{"id":"2.2","status":"CLO modified","old":{"domain":null,"clo_id":2.2,"clo_text":"Use lateral and critical thinking to generate creative alternative concepts and identify a preferred solution to a design problem. \nGenerate alternative concepts and select a preferred solution for a design problem.","aligned_sos":["SO2"],"aligned_pis":["PI21","PI23"]},"new":{"domain":null,"clo_id":2.2,"clo_text":"Generate alternative concepts and select a preferred solution for a design problem.","aligned_sos":["SO2"],"aligned_pis":["PI21","PI23"]}},{"id":"2.3","status":"CLO modified","old":{"domain":null,"clo_id":2.3,"clo_text":"Use engineering tools and drawing skills to check and visually communicate design problem-solving.\nCommunicate design solutions visually using engineering tools and drawings.","aligned_sos":["SO3"],"aligned_pis":["PI31"]},"new":{"domain":null,"clo_id":2.3,"clo_text":"Communicate design solutions visually using engineering tools and drawings.","aligned_sos":["SO3"],"aligned_pis":["PI31"]}},{"id":"2.4","status":"CLO modified","old":{"domain":null,"clo_id":2.4,"clo_text":"Communicate effectively and define engineering design problems and keep a well build log file and keep a journal of ideas and activities associated with the design project.\nCommunicate design solutions using written, visual, and oral technical methods.","aligned_sos":["SO3"],"aligned_pis":["PI31","PI32"]},"new":{"domain":null,"clo_id":2.4,"clo_text":"Communicate design solutions using written, visual, and oral technical methods.","aligned_sos":["SO3"],"aligned_pis":["PI31","PI32"]}},{"id":"3.1","status":"CLO modified","old":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Recognize the engineering profession and the importance of ethical and legal factors in professional duties\nEvaluate ethical and legal responsibilities and their impact on engineering decisions.","aligned_sos":["SO4"],"aligned_pis":["PI41","PI42"]},"new":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Evaluate ethical and legal responsibilities and their impact on engineering decisions.","aligned_sos":["SO4"],"aligned_pis":["PI41","PI42"]}},{"id":"3.2","status":"CLO modified","old":{"domain":null,"clo_id":3.2,"clo_text":"Establish requirements, scopes, plan tasks, and meet objectives through effective teamwork.\nCollaborate to establish goals, plan tasks, and meet project objectives within a team.","aligned_sos":["SO5"],"aligned_pis":["PI51","PI52"]},"new":{"domain":null,"clo_id":3.2,"clo_text":"Collaborate to establish goals, plan tasks, and meet project objectives within a team.","aligned_sos":["SO5"],"aligned_pis":["PI51","PI52"]}}]},{"code":"EE 492","title":"Cooperative Training","changes":[{"id":"1.2","status":"CLO modified","old":{"domain":null,"clo_id":1.2,"clo_text":"Define and recognize complex electrical engineering problems encountered in industry, utilizing theoretical knowledge acquired in academic coursework to propose innovative and effective solutions.\nIdentify complex electrical engineering problems encountered in industry using theoretical knowledge acquired in academic coursework to propose innovative and effective solutions.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]},"new":{"domain":null,"clo_id":1.2,"clo_text":"Identify complex electrical engineering problems encountered in industry using theoretical knowledge acquired in academic coursework to propose innovative and effective solutions.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]}},{"id":"2.2","status":"CLO modified","old":{"domain":null,"clo_id":2.2,"clo_text":"Examine advanced technical skills in electrical engineering, including  design, analysis, and troubleshooting, to successfully complete assigned tasks and projects within cooperative work environments.\nApply advanced technical electrical engineering skills in design, analysis, and troubleshooting to complete assigned tasks and projects in a cooperative work environment.","aligned_sos":["SO1","SO6"],"aligned_pis":["PI12","PI63","PI64"]},"new":{"domain":null,"clo_id":2.2,"clo_text":"Apply advanced technical electrical engineering skills in design, analysis, and troubleshooting to complete assigned tasks and projects in a cooperative work environment.","aligned_sos":["SO1","SO6"],"aligned_pis":["PI12","PI63","PI64"]}},{"id":"3.2","status":"CLO modified","old":{"domain":null,"clo_id":3.2,"clo_text":"Demonstrate professional and ethical responsibility\nDemonstrate professional and ethical responsibility in engineering practice and decision-making.","aligned_sos":["SO4"],"aligned_pis":["PI41","PI42"]},"new":{"domain":null,"clo_id":3.2,"clo_text":"Demonstrate professional and ethical responsibility in engineering practice and decision-making.","aligned_sos":["SO4"],"aligned_pis":["PI41","PI42"]}}]},{"code":"EE 414","title":"Electrical and Electronic Measurements","changes":[]},{"code":"EE 415","title":"Opto-Electronics","changes":[]},{"code":"EE 416","title":"VLSI Circuits Design","changes":[]},{"code":"EE 423","title":"Data Communication Networks","changes":[]},{"code":"EE 424","title":"Digital Communications","changes":[]},{"code":"EE 425","title":"Wireless Communications Systems","changes":[]},{"code":"EE 426","title":"Antenna and wave propagation","changes":[]},{"code":"EE 433","title":"Mechatronics","changes":[]},{"code":"EE 434","title":"PLC Microcontrollers","changes":[{"id":"1.1","status":"CLO modified","old":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Describe fundamental automation and control concepts related to programmable logic controllers and relay ladder logic.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]},"new":{"domain":"Knowledge and understanding","clo_id":1.1,"clo_text":"Analyze and solve basic automation and control problems using programmable logic controllers and relay ladder logic.","aligned_sos":["SO1"],"aligned_pis":["PI11","PI12"]}},{"id":"1.2","status":"CLO modified","old":{"domain":null,"clo_id":1.2,"clo_text":"Explain PLC hardware structure, programming concepts, and industrial applications using appropriate technical terminology, ladder diagrams, and documentation.","aligned_sos":["SO1","SO3"],"aligned_pis":["PI11","PI12","PI31","PI32"]},"new":{"domain":null,"clo_id":1.2,"clo_text":"Explain PLC hardware structure, programming concepts, and industrial applications using appropriate technical terminology, ladder diagrams, and documentation.","aligned_sos":["SO3"],"aligned_pis":["PI31","PI32"]}},{"id":"3.1","status":"CLO modified","old":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Apply new PLC functions, instructions, and communication concepts using manuals, software tools, and self-directed learning resources.","aligned_sos":["SO7"],"aligned_pis":["PI71","PI72"]},"new":{"domain":"Values, autonomy and responsibility","clo_id":3.1,"clo_text":"Acquire and apply new PLC functions, instructions, and communication concepts using manuals, software tools, and self-directed learning resources.","aligned_sos":["SO7"],"aligned_pis":["PI71","PI72"]}}]},{"code":"EE 435","title":"Robotics and Automation","changes":[]},{"code":"EE 436","title":"Artifitial Intellegince","changes":[]},{"code":"EE 442","title":"Digital Signal Processing","changes":[]},{"code":"EE 456","title":"Renewable Energy Engineering","changes":[]},{"code":"EE 499","title":"Special Topics In Electrical and Electronics Engineering","changes":[]}];
    const escHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const mappingHtml = record => {
      if (!record) return '<span class="empty">Not present</span>';
      const items = [...(record.aligned_sos || []), ...(record.aligned_pis || [])];
      return items.length ? items.map(item => '<span class="pill">' + escHtml(item) + '</span>').join(' ') : '<span class="empty">No mapping</span>';
    };
    const versionHtml = (label, record, cls) => `
      <div class="version ${cls}">
        <h3>${label}</h3>
        <div class="clo-text">${record && record.clo_text ? escHtml(record.clo_text) : '<span class="empty">' + (record ? 'Blank CLO statement' : 'Not present') + '</span>'}</div>
        <div class="mapping"><span class="mapping-label">Mapping</span>${mappingHtml(record)}</div>
      </div>`;
    function renderCourse(code) {
      const course = courses.find(item => item.code === code) || courses[0];
      document.getElementById('courseHeading').innerHTML = '<span class="code">' + escHtml(course.code) + '</span><h2 style="margin:7px 0 0">' + escHtml(course.title) + '</h2>';
      document.getElementById('summary').textContent = course.changes.length ? course.changes.length + ' CLO change' + (course.changes.length === 1 ? '' : 's') : 'No CLO changes';
      if (!course.changes.length) {
        document.getElementById('results').innerHTML = '<div class="no-change"><strong>No change</strong>All CLO text and mappings are unchanged for this course.</div>';
        return;
      }
      document.getElementById('results').innerHTML = course.changes.map(change => {
        const cls = change.status.toLowerCase().replace('clo ', '');
        return `<article class="change-card">
          <div class="change-head"><span class="change-id">${escHtml(change.id.startsWith('Portal') ? change.id : 'CLO ' + change.id)}</span><span class="status ${cls}">${escHtml(change.status)}</span></div>
          <div class="compare-grid">${versionHtml('Old', change.old, 'old')}${versionHtml('New', change.new, 'new')}</div>
        </article>`;
      }).join('');
    }
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('courseSelect');
      select.innerHTML = courses.map(course => '<option value="' + escHtml(course.code) + '">' + escHtml(course.code + ' — ' + course.title) + '</option>').join('');
      select.addEventListener('change', () => renderCourse(select.value));
      renderCourse(select.value);
    });
  </script>
</body>
</html>
