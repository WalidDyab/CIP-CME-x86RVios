<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSc EE Course Dashboard</title><link rel="stylesheet" href="../assets/portal.css"><script defer src="../assets/portal.js"></script></head><body><div id="header-placeholder"></div><div class="wrap" style="padding-top: 14px;"><div class="title" style="margin-bottom: 24px;"><h1>MSc EE Course Dashboard</h1><p>PSU College of Engineering Curriculum Intelligence Portal</p></div>
<section class="hero"><span class="kicker">MSc EE</span><h2>Course Dashboard</h2><p class="muted">Reads every course directly from <code>msc_ee_courses_full.json</code>.</p></section><div class="layout"><aside class="card sidebar"><h2>Courses</h2><div class="toolbar"><input id="search" class="input" placeholder="Search…"><select id="trackFilter" class="select"></select><span id="resultCount" class="pill"></span></div><div id="courseList" class="course-list"></div></aside><main id="detail" class="grid"></main></div><script>document.addEventListener('DOMContentLoaded',async()=>{try{const courses=await portal.loadJSON('../data/msc_ee_courses_full.json'); portal.setupCourseBrowser(courses,{linkPrefix:'course-dashboard.html?course='}); const wanted=portal.getParam('course')||portal.normCourse(courses[0]).code; const c=portal.normCourse(courses.find(x=>portal.normCourse(x).code===wanted)||courses[0]); byId('detail').innerHTML=`<section class="card"><div class="code">${portal.esc(c.code)}</div><h2>${portal.esc(c.title)}</h2><div>${portal.badge(c.track)}${portal.badge(c.re)}${portal.badge(c.credits+' credits')}${portal.badge('Prereq: '+(c.prereq||'N.A.'))}</div><p class="muted">${portal.esc(c.desc)}</p></section><section class="card"><h2>Course Learning Outcomes</h2>${portal.renderCLOTable(c.clos)}</section><section class="card"><h2>Topics</h2>${portal.renderTopics(c.topics)}</section><section class="grid two"><div class="card"><h2>Textbooks</h2><p class="muted">${portal.esc((c.textbooks||[]).join('\n'))}</p></div><div class="card"><h2>References</h2><p class="muted">${portal.esc((c.references||[]).join('\n'))}</p></div></section>`;}catch(e){byId('detail').innerHTML='<div class="alert">Could not load JSON. Run: python -m http.server 8000</div>'}})</script>
<div class="footer">One source of truth: JSON data files. Refresh the page after updating JSON.</div></div>
<div id="footer-placeholder"></div>

</body></html>
