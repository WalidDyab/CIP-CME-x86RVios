<!doctype html><html lang="en"><head>
  <meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSc EE Concentration Dashboard</title><link rel="stylesheet" href="../assets/portal.css"><script defer src="../assets/portal.js"></script></head><body><div id="header-placeholder"></div><div class="wrap" style="padding-top: 14px;"><div class="title" style="margin-bottom: 24px;"><h1>MSc EE Concentration Dashboard</h1><p>PSU College of Engineering Curriculum Intelligence Portal</p></div>
<section class="hero"><span class="kicker">MSc EE</span><h2>Concentration Dashboard</h2><p class="muted">Courses grouped dynamically by focus area / track.</p></section><section id="groups" class="grid two"></section><script>document.addEventListener('DOMContentLoaded',async()=>{try{const courses=(await portal.loadJSON('../data/msc_ee_courses_full.json')).map(portal.normCourse); const groups={}; courses.forEach(c=>{(groups[c.track||'General']??=[]).push(c)}); byId('groups').innerHTML=Object.entries(groups).map(([g,cs])=>`<div class="card"><h2>${portal.esc(g)}</h2><p class="muted">${cs.length} courses</p><div class="course-list">${cs.map(c=>`<a class="course-card" href="course-dashboard.html?course=${encodeURIComponent(c.code)}"><div class="code">${portal.esc(c.code)}</div><div class="course-title">${portal.esc(c.title)}</div><p class="desc">${portal.esc(c.desc)}</p></a>`).join('')}</div></div>`).join('')}catch(e){byId('groups').innerHTML='<div class="alert">Could not load JSON.</div>'}})</script>
<div class="footer">One source of truth: JSON data files. Refresh the page after updating JSON.</div></div>
<div id="footer-placeholder"></div>

</body></html>
